[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"
  # Fuerza el build en cada deploy automático. El directorio base
  # ("WATCHOUT TOURS", con espacio) rompe la comprobación de cambios por
  # defecto de Netlify y hace que cancele los deploys automáticos; con esto
  # el comando "ignore" devuelve siempre != 0, así que nunca se omite.
  ignore    = "/bin/false"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Cabeceras de seguridad ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://lznilssdnhmorqgzwboy.supabase.co https://formspree.io; frame-src https://app.netlify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"
