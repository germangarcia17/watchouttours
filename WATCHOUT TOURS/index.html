<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El título y la meta description reales los gestiona react-helmet-async
         por página (componente Seo, editable desde /admin/seo). Los de aquí
         son solo el valor por defecto antes de que cargue JavaScript o para
         rutas que no se prerenderizan (p. ej. /admin). -->
    <title>Watchout Tours · Viajes sensoriales por Nueva Zelanda</title>
    <meta name="description" content="Viajes guiados y accesibles por Nueva Zelanda para personas ciegas y con baja visión. Experiencias sensoriales, autonomía y aventura." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
    <!-- Datos estructurados de la organización para Google (Rich Results / Knowledge Graph). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "@id": "https://watchouttours.nz/#organization",
        "name": "Watchout Tours",
        "url": "https://watchouttours.nz",
        "logo": "https://watchouttours.nz/favicon-512.png",
        "image": "https://watchouttours.nz/og-image.jpg",
        "description": "Watchout Tours diseña y guía viajes sensoriales en grupos de máximo 6 personas por Nueva Zelanda, en español y en inglés, con dos guías durante todo el viaje. Viajes +60, para quien quiere viajar con calma y comodidad total, y viajes para personas ciegas y con baja visión.",
        "email": "info@watchouttours.nz",
        "areaServed": "NZ",
        "knowsLanguage": ["es", "en"],
        "knowsAbout": [
          "Accessible travel",
          "Blind travel",
          "Travel for the visually impaired",
          "Guided tours in New Zealand",
          "Sensory travel experiences"
        ],
        "sameAs": ["https://www.instagram.com/watchouttours/"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://watchouttours.nz/#website",
        "name": "Watchout Tours",
        "url": "https://watchouttours.nz",
        "inLanguage": ["es", "en"],
        "publisher": { "@id": "https://watchouttours.nz/#organization" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
