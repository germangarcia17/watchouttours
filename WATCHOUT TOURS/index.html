<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- La meta description y el título los gestiona react-helmet-async
         por página (componente Seo, editable desde /admin/seo). -->
    <title>WatchOut! Sensory Tours</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Datos estructurados de la organización para Google (Rich Results / Knowledge Graph). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Watchout Tours",
        "url": "https://watchouttours.nz",
        "logo": "https://watchouttours.nz/favicon-512.png",
        "image": "https://watchouttours.nz/favicon-512.png",
        "description": "Viajes sensoriales por Nueva Zelanda diseñados para personas ciegas y con baja visión.",
        "email": "info@watchouttours.nz",
        "areaServed": "NZ",
        "knowsLanguage": ["es", "en"],
        "sameAs": ["https://www.instagram.com/watchouttours/"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
