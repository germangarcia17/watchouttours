<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El título y la meta description reales los gestiona react-helmet-async
         por página (componente Seo, editable desde /admin/seo). Los de aquí
         son solo el valor por defecto antes de que cargue JavaScript o para
         rutas que no se prerenderizan (p. ej. /admin). -->
    <title>WatchOut Tours · Viajes de autor por Nueva Zelanda</title>
    <meta name="description" content="Viajes privados y salidas en grupo reducido por Nueva Zelanda, diseñados y acompañados por sus fundadoras, dos barcelonesas que viven en el país. Hoteles de 4 y 5 estrellas y experiencias privadas." />
    <!-- ?v=2: favicon-32.png y apple-touch-icon.png tienen el mismo nombre que
         los del logo antiguo; el parámetro obliga al navegador a descargar los
         nuevos en vez de usar los que tiene guardados. Subir el número si se
         vuelven a cambiar. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png?v=2" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet" />
    <!-- Datos estructurados de la organización para Google (Rich Results / Knowledge Graph). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "@id": "https://watchouttours.nz/#organization",
        "name": "Watchout Tours",
        "url": "https://watchouttours.nz",
        "logo": "https://watchouttours.nz/icon-512.png",
        "image": "https://watchouttours.nz/og-image.jpg",
        "description": "WatchOut Tours es una agencia de viajes de autor con sede en Nueva Zelanda, fundada por Sylvie y Mónica, dos barcelonesas que viven en el país. Diseña y acompaña viajes privados a medida, salidas en grupo reducido, viajes +60 y viajes para personas ciegas y con baja visión, en español y en inglés.",
        "email": "info@watchouttours.nz",
        "areaServed": "NZ",
        "knowsLanguage": ["es", "en"],
        "knowsAbout": [
          "Accessible travel",
          "Blind travel",
          "Travel for the visually impaired",
          "Guided tours in New Zealand",
          "Bespoke travel in New Zealand",
          "Responsible tourism (Tiaki Promise)"
        ],
        "sameAs": ["https://www.instagram.com/watchouttours/"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://watchouttours.nz/#website",
        "name": "Watchout Tours",
        "url": "https://watchouttours.nz",
        "inLanguage": ["es", "en"],
        "publisher": { "@id": "https://watchouttours.nz/#organization" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
